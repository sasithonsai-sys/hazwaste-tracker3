<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2a30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ระบบบริหารจัดการของเสียสารเคมีและของเสียอันตราย — คณะวิทยาศาสตร์และเทคโนโลยี ม.ราชภัฏหมู่บ้านจอมบึง</title>
<style>
:root{
  --ink:#0e1f24; --ink2:#3c5158; --line:#dce3e6; --bg:#eef2f3; --card:#ffffff;
  --brand:#0f766e; --brand-d:#0b5a54; --rail:#0e2a30; --rail2:#123a41;
  --amber:#b45309; --red:#dc2626; --ok:#0f766e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Sarabun","TH Sarabun New","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* rail */
.rail{background:linear-gradient(180deg,var(--rail),var(--rail2));color:#cfe3e2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
#uni-logo{width:72px;height:72px;object-fit:contain;margin:0 auto 8px;display:block;background:transparent;padding:0}
.logo-fallback{width:56px;height:56px;border-radius:14px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 8px}
.brand h1{font-size:14px;margin:0;color:#fff;font-weight:800;line-height:1.3}
.brand p{margin:4px 0 0;font-size:11px;color:#8fb3b0;line-height:1.45}
#nav{display:flex;flex-direction:column;padding:12px 10px;gap:3px;flex:1}
#nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#bcd6d4;padding:11px 13px;border-radius:9px;font:inherit;font-size:14.5px;cursor:pointer;text-align:left;transition:.15s}
#nav button:hover{background:rgba(255,255,255,.06);color:#fff}
#nav button.active{background:var(--brand);color:#fff;font-weight:700}
#nav .ic{width:20px;text-align:center;font-size:16px}
.rail-foot{padding:12px 16px;font-size:11px;color:#6f9490;border-top:1px solid rgba(255,255,255,.08)}
/* main */
main{padding:26px 30px 60px;max-width:1180px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.2px}
.muted{color:var(--ink2);font-size:13.5px;margin:4px 0 0}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.nopad{padding:0;overflow:hidden}
.card-title{font-weight:700;font-size:15px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;border-width:1.5px;border-radius:12px;text-align:center}
.stat-top{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:4px}
.stat-ic{font-size:18px}
.stat-label{font-size:13.5px;font-weight:600}
.stat-val{font-size:30px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat-unit{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px}
.stat-sub{font-size:11.5px;color:var(--ink2);margin-top:4px}
.stat.s-blue{background:#eaf1fb;border-color:#c3d7f2}.stat.s-blue .stat-val,.stat.s-blue .stat-label{color:#1c56b0}
.stat.s-green{background:#e9f7ee;border-color:#bce6ca}.stat.s-green .stat-val,.stat.s-green .stat-label{color:#1f9d57}
.stat.s-orange{background:#fdf0e6;border-color:#f6d3b3}.stat.s-orange .stat-val,.stat.s-orange .stat-label{color:#d9762a}
.stat.s-red{background:#fdecec;border-color:#f5c6c6}.stat.s-red .stat-val,.stat.s-red .stat-label{color:#d33a3a}
/* alerts */
.alerts{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.alerts-head{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pill{background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:1px 9px;font-weight:700}
.alert-row{background:#fdf0ef;border-left:4px solid var(--red);color:#7f1d1d;padding:9px 12px;border-radius:6px;font-size:13.5px;margin-top:6px}
.alert-row.ok{background:#eefaf6;border-color:var(--ok);color:#0b5a4f}
/* chart */
.chart{width:100%}.svgchart{width:100%;height:auto}.axl{font-size:9px;fill:#7a8a8f}
.pie-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.svgpie{width:200px;height:200px}
.sc-stghist{margin:4px 0 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px}.lg{display:flex;align-items:center;gap:8px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}.lg b{margin-left:auto;font-variant-numeric:tabular-nums}
/* form */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.fld input,.fld select,.fld textarea{min-width:0;max-width:100%;font:inherit;font-weight:500;color:var(--ink);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfcfc}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.fld input[readonly]{background:#eef2f3;color:var(--ink2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.row .fld:first-child:nth-last-child(3),.row .fld{grid-column:auto}
.reg .row{grid-template-columns:repeat(3,minmax(0,1fr))}
.type-info{background:#f4f8f8;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:13px;color:var(--ink2)}
.type-info .ti-def{color:var(--ink);margin-bottom:5px}.ti-code{margin-top:6px;font-size:12.5px}.ti-code b{font-family:ui-monospace,Consolas,monospace;color:var(--brand)}
.capwarn:not(:empty){background:#fff7ed;border-left:4px solid var(--amber);color:#92400e;padding:8px 11px;border-radius:6px;font-size:13px;margin-bottom:12px}
/* buttons */
.btn{font:inherit;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover{border-color:#b8c4c8}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:#fff}
.btn.block{width:100%;margin-top:6px}.btn.sm{padding:7px 12px;font-size:13px}
/* label side */
.label-side{position:sticky;top:20px;align-self:start}
#label-preview{transform-origin:top left}
.hzlabel{border:2.5px solid #111;border-radius:3px;overflow:hidden;margin-bottom:12px;background:#fff;color:#111}
.hz-title{font-weight:800;font-size:20px;text-align:center;padding:9px 10px;border-bottom:2.5px solid #111;line-height:1.2}
.hz-row2{display:flex;align-items:stretch;border-bottom:2.5px solid #111}
.hz-codebox{border-right:2.5px solid #111;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:96px}
.hz-code{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:30px;line-height:1}
.hz-runcode{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#333;margin-top:3px}
.hz-en{flex:1;display:flex;align-items:center;padding:6px 14px;font-size:20px;font-weight:800}
.hz-picts{display:flex;align-items:center;gap:4px;padding:5px 8px;border-left:2.5px solid #111}
.pt{display:flex;flex-direction:column;align-items:center;font-size:9px;color:#333;width:56px}.pt .ghs{width:48px;height:48px}
img.ghs{object-fit:contain;background:#fff}
.hz-fields{position:relative;padding:9px 74px 9px 12px;border-bottom:2.5px solid #111;min-height:96px}
.hz-f{font-size:12.5px;line-height:1.9;color:#111}.hz-f b{font-weight:700}
.hz-f .dl{border-bottom:1px dotted #888;display:inline-block;min-width:120px;padding:0 4px}
.hz-f.full .dl{min-width:60%}
.hz-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:2px}
.hz-qrbox{position:absolute;top:8px;right:10px;width:58px;height:58px;background:#fff}
.hz-qrbox svg{width:100%;height:100%;display:block}
.hz-fields .red{color:#c00;font-weight:700}
.hz-foot{display:flex;justify-content:space-between;align-items:center;background:#ffe600;padding:5px 12px}
.hz-part{font-size:11px;font-weight:700;color:#111}.hz-care{color:#c00;font-weight:800;font-size:14px;letter-spacing:.5px}
/* drug waste label — matches official ของเสียยาเสื่อมสภาพ / ยาอันตรายสูง form */
.hzlabel-drug{display:block}
.hzd-title{font-weight:800;font-size:22px;text-align:center;padding:10px 10px;border-bottom:2.5px solid #111}
.hzd-row{display:flex;align-items:stretch;border-bottom:2.5px solid #111}
.hzd-col1{width:34%;border-right:2.5px solid #111;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.hzd-col2{flex:1;padding:10px 14px;display:flex;align-items:center;justify-content:center}
.hzd-drugs-label{font-weight:800;font-size:24px;line-height:1}
.hzd-code-line{font-size:10.5px;color:#333;margin-top:5px}
.hzd-enname{font-weight:800;font-size:21px;text-align:center}
.hzd-icon-col{width:34%;border-right:2.5px solid #111;padding:10px;display:flex;align-items:center;justify-content:center}
.hzd-icon-col img{width:92px;height:92px;display:block;object-fit:contain}
.hzd-detail-col{flex:1;padding:10px 14px;position:relative;min-height:112px}
.hzd-detail-title{font-weight:700;font-size:12.5px;margin-bottom:6px}
.hzd-detail-text{font-size:12px;line-height:1.65;color:#222;padding-right:60px}
.hzd-qrbox{position:absolute;top:8px;right:10px;width:46px;height:46px;background:#fff}
.hzd-qrbox svg{width:100%;height:100%;display:block}
.hzd-fieldrow{padding:9px 14px;border-bottom:2.5px solid #111;font-size:13px;line-height:1.7}
.hzd-fieldrow:last-of-type{border-bottom:2.5px solid #111}
.hzd-fieldrow .dl{border-bottom:1px dotted #888;display:inline-block;min-width:110px;padding:0 4px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.tbl.sm th,.tbl.sm td{padding:7px 9px;font-size:13px}
.tbl thead th{background:#f4f7f7;font-size:12.5px;color:var(--ink2);font-weight:700;position:sticky;top:0}
.tbl tbody tr:hover{background:#f8fbfa}
.tbl .ctr{text-align:center}.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:600}
.tag{display:inline-block;font-family:ui-monospace,monospace;font-weight:700;font-size:11px;color:#fff;background:var(--tc,#555);padding:1px 7px;border-radius:5px;margin-right:5px}
.bar{height:5px;background:#eef2f3;border-radius:4px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%}
.st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.st-filling{background:#e7f0fa;color:#1e5aa8}.st-awaiting{background:#fff3e0;color:#b45309}.st-disposed{background:#e9f7f1;color:#0b5a4f}
.mini-sel{font:inherit;font-size:12px;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:#fbfcfc;color:var(--ink);max-width:180px}
.act{white-space:nowrap;text-align:right}
.mini{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;margin-left:3px}
.mini:hover{background:#f2f6f6;border-color:#b8c4c8}.mini.danger{color:var(--red);border-color:#f0c9c9}.mini.danger:hover{background:#fdeeee}
.red{color:var(--red);font-weight:700}.amber{color:var(--amber);font-weight:700}
.empty{text-align:center;color:var(--ink2);padding:44px 20px;background:#fff;border:1px dashed var(--line);border-radius:14px}.empty.sm{padding:20px;border:0}
.search,input[type=month]{font:inherit;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:210px}
/* report */
.rep-title{text-align:center;font-weight:800;font-size:17px;margin:2px 0 14px}.rep-title span{font-weight:400;font-size:14px;color:var(--ink2)}.rep-title.mt{margin-top:26px}
#report-doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
.treat-block{margin:12px 0}.treat-h{font-weight:700;background:#eef4f4;padding:7px 11px;border-left:4px solid var(--brand);border-radius:5px;margin-bottom:6px}
/* criteria */
.crit-group{margin-bottom:26px}.crit-group h2{font-size:16px;margin:0 0 12px;padding-bottom:7px;border-bottom:2px solid var(--line)}
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.crit-card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--tc,#555);border-radius:12px;padding:15px}
.crit-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.crit-code{font-family:ui-monospace,monospace;font-weight:800;font-size:17px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,#fff);padding:2px 10px;border-radius:7px}
.crit-pt .ghs{width:30px;height:30px}
.crit-name{font-weight:700;font-size:14.5px;margin-bottom:6px}
.crit-def{font-size:13px;color:var(--ink2);margin-bottom:8px}
.crit-f{font-size:12.5px;margin-bottom:4px}.crit-f b{color:var(--ink)}
.crit-card .btn{margin-top:10px}
/* segmented control + inline inputs */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.segbtn{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border:0;background:#fff;color:var(--ink2);cursor:pointer}
.segbtn.on{background:var(--brand);color:#fff}
.inl{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.inl input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.inl-row{display:flex;gap:8px}.inl-row input{flex:1;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
.rep-note{background:#eef4f4;border-left:4px solid var(--brand);color:var(--ink2);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:14px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0 12px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand)}
.sync-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.sync-status{margin-top:10px;font-size:13px;color:var(--ink2);background:#f4f7f7;padding:8px 11px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#f0c9c9}.btn.danger:hover{background:#fdeeee}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0 14px}
/* scan */
.scan-box{width:100%;min-height:270px;background:#0e2a30;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.scan-box video{width:100%!important;height:auto!important;display:block}
.scan-hint{color:#9fc4c1;text-align:center;padding:26px;font-size:14px;line-height:1.6}
.scan-status{margin-top:10px;font-size:13.5px;min-height:20px}.scan-status .ok-t{color:var(--ok);font-weight:700}
.scan-manual{margin-top:12px}
.scan-card{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sc-h{color:#fff;font-weight:700;padding:10px 14px}
.sc-b{padding:14px;font-size:14px;line-height:1.9}
.sc-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* official report on screen */
.offi-doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;color:#111}
.offi-formno{text-align:right;font-weight:700}
.offi-title{text-align:center;font-weight:800;font-size:19px}
.offi-sub{text-align:center;margin-bottom:8px;color:var(--ink2)}
.offi-org{font-weight:700;margin-top:6px}.offi-line{font-size:13px;color:#333}
.offi-stmt{margin:10px 0;text-indent:2em;line-height:1.7;font-size:14px}
.offi{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
.offi th,.offi td{border:1px solid #bbb;padding:5px 9px}
.offi th{background:#eef2f3;text-align:center;font-weight:700}
.offi .ctr{text-align:center}
.offi .sec td{background:#f3f6f6;font-weight:700}
.offi .sum td{background:#fafcfc;font-weight:700}
.offi-sign{display:flex;justify-content:space-around;margin-top:32px;text-align:center;font-size:13.5px;gap:20px}
.offi-sign.one{justify-content:center}.sg .sg-line{margin-bottom:6px;color:#555}
/* rule box */
.rulebox{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 6px}
.rulebox summary{cursor:pointer;font-weight:700;padding:12px 12px;list-style:none}
.rulebox summary::-webkit-details-marker{display:none}
.rulebox summary::before{content:"▸ ";color:var(--brand)}
.rulebox[open] summary::before{content:"▾ "}
.rulebox ul{margin:0 0 12px;padding:0 20px 0 34px;line-height:1.85;font-size:13.5px;color:var(--ink2)}
.rulebox b{color:var(--ink)}
/* donut */
.svgpie{width:210px;height:210px;flex:none}
.donut-c{font-size:26px;font-weight:800;fill:var(--ink)}.donut-u{font-size:11px;fill:var(--ink2)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:150px;flex:1}
.lg{display:flex;align-items:center;gap:8px}.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.lg-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg b{font-variant-numeric:tabular-nums}
/* registry extras */
.tbl-scroll{overflow-x:auto}
.tbl td .sub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.pctlbl{font-size:11px;margin-top:2px;color:var(--ink2)}.pctlbl.red{color:var(--red);font-weight:700}
.ins{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.ins.ok{background:#e9f7f1;color:#0b5a4f}.ins.warn{background:#fff3e0;color:#b45309}.ins.none{background:#eef2f3;color:#7a8a8f;font-weight:600}
.ins-list{display:flex;flex-direction:column;gap:4px}
.ins-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;cursor:pointer}
.ins-item input{width:18px;height:18px;accent-color:var(--brand);flex:none}
/* tenant note */
.tenant-note{background:#eef6f5;border:1px solid #cfe6e3;border-left:4px solid var(--brand);color:#0b5a4f;padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;line-height:1.55}
/* toast + modal */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#0e2a30;color:#fff;padding:12px 22px;border-radius:11px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(10,25,30,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
.modal-box{background:#fff;border-radius:15px;max-width:520px;width:100%;overflow:hidden}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-weight:700;border-bottom:1px solid var(--line)}
.modal-x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink2)}
.modal-b{padding:18px;max-height:60vh;overflow:auto}
/* ===== responsive: PC / แท็บเล็ต / โทรศัพท์ ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.app{grid-template-columns:236px minmax(0,1fr)}
.rail,main{min-width:0}
main{width:100%;max-width:1400px}
img,svg,video,canvas{max-width:100%}
button,.btn,.mini,.segbtn,#nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tbl-scroll{-webkit-overflow-scrolling:touch}
#toast{max-width:calc(100vw - 32px);text-align:center}
.crit-grid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}

/* จอใหญ่ (ตั้งแต่ 1600px) */
@media(min-width:1600px){
  body{font-size:16px}
  main{padding:32px 48px 70px}
}

/* โน้ตบุ๊กเล็ก / แท็บเล็ตแนวนอน (921–1180px) */
@media(min-width:921px) and (max-width:1180px){
  .app{grid-template-columns:208px minmax(0,1fr)}
  main{padding:22px 20px 50px}
  .reg .row{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* แท็บเล็ตและลงไป (<=920px): เนื้อหาเรียงคอลัมน์เดียว */
@media(max-width:920px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  main{padding:18px 18px 50px}
  .label-side{position:static}
  .page-head h1{font-size:21px}
}
@media(max-width:860px){
  .stat-grid{grid-template-columns:1fr 1fr}
}

/* แท็บเล็ตแนวตั้ง (641–920px): เมนูซ้ายแบบไอคอนแคบ ยังกดได้ตลอด */
@media(min-width:641px) and (max-width:920px){
  .app{grid-template-columns:92px minmax(0,1fr)}
  .rail{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
  .brand{padding:12px 6px 10px}
  .brand h1,.brand p{display:none}
  #uni-logo{width:54px;height:54px;margin:0 auto}
  #nav{padding:8px 6px}
  #nav button{flex-direction:column;justify-content:center;gap:3px;padding:10px 3px;font-size:11px;line-height:1.25;text-align:center}
  #nav .ic{font-size:21px;width:auto}
  .rail-foot{display:none}
}

/* โทรศัพท์ (<=640px): หัวเล็ก + แถบเมนูล่าง + ตารางเป็นการ์ด */
@media(max-width:640px){
  body{font-size:15px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;padding-top:env(safe-area-inset-top)}
  .brand{display:flex;align-items:center;gap:10px;text-align:left;border:0;padding:8px 14px;width:100%}
  #uni-logo{width:38px;height:38px;margin:0;flex:none}
  .logo-fallback{width:38px;height:38px;margin:0;font-size:20px;flex:none}
  .brand h1{font-size:14px;line-height:1.3}
  .brand p{display:none}
  .rail-foot{display:none}
  /* แถบเมนูด้านล่าง (เอื้อมนิ้วโป้งง่าย) */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:45;flex-direction:row;flex:none;gap:2px;
       padding:6px 6px calc(6px + env(safe-area-inset-bottom));
       background:linear-gradient(180deg,var(--rail2),var(--rail));border-top:1px solid rgba(255,255,255,.14);
       box-shadow:0 -6px 20px rgba(0,0,0,.2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #nav::-webkit-scrollbar{display:none}
  #nav button{flex:0 0 auto;width:76px;flex-direction:column;justify-content:flex-start;gap:2px;padding:7px 4px;
       font-size:10.5px;line-height:1.2;text-align:center;white-space:normal;border-radius:10px;min-height:56px}
  #nav .ic{font-size:20px;width:auto}
  main{padding:14px 12px calc(92px + env(safe-area-inset-bottom))}
  .page-head{align-items:flex-start;margin-bottom:14px}
  .page-head h1{font-size:19px}
  .head-actions{width:100%}
  .head-actions .btn,.head-actions .search,.head-actions input{flex:1 1 auto}
  .search,input[type=month]{min-width:0;width:100%}
  .card{padding:14px;border-radius:12px}
  .stat-grid{gap:10px}
  .stat{padding:12px 8px}
  .stat-val{font-size:25px}.stat-label{font-size:12.5px}
  .row,.reg .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  /* กันหน้าจอ iOS ซูมเองเวลาแตะช่องกรอก + ปุ่มใหญ่พอแตะ */
  .fld input,.fld select,.fld textarea,.inl input,.inl-row input,.search,input[type=month],.mini-sel{font-size:16px}
  .fld input,.fld select{min-height:44px}
  .btn{min-height:44px;padding:10px 14px}
  .btn.sm{min-height:38px}
  .segbtn{padding:10px 14px}
  .sync-row .btn{flex:1 1 100%}
  /* ตาราง -> การ์ด */
  .tbl:not(.offi):not(.sm),.tbl:not(.offi):not(.sm) tbody,.tbl:not(.offi):not(.sm) tr,.tbl:not(.offi):not(.sm) td{display:block;width:100%}
  .tbl:not(.offi):not(.sm) thead{display:none}
  .tbl:not(.offi):not(.sm) tr{padding:12px 14px;border-bottom:8px solid var(--bg)}
  .tbl:not(.offi):not(.sm) tr:last-child{border-bottom:0}
  .tbl:not(.offi):not(.sm) td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;text-align:right}
  .tbl:not(.offi):not(.sm) td::before{content:attr(data-label);font-weight:700;font-size:12px;color:var(--ink2);text-align:left;flex:none;max-width:40%}
  .tbl:not(.offi):not(.sm) td[colspan]{justify-content:center}
  .tbl:not(.offi):not(.sm) td[colspan]::before{display:none}
  .tbl:not(.offi):not(.sm) td:first-child{font-size:15px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
  .tbl:not(.offi):not(.sm) td.act{flex-wrap:wrap;justify-content:flex-start;white-space:normal;gap:6px;padding-top:10px}
  .tbl:not(.offi):not(.sm) td.act::before{display:none}
  .tbl:not(.offi):not(.sm) td.act .mini,.tbl:not(.offi):not(.sm) td.act button{margin:0;padding:9px 12px;font-size:13px}
  .mini-sel{max-width:100%;padding:8px}
  .tbl:not(.offi):not(.sm) td .mini-sel{flex:1 1 0;min-width:0;width:auto}
  .tbl.sm th,.tbl.sm td{padding:7px 6px;font-size:12.5px}
  /* รายงานทางการ: เลื่อนซ้ายขวาในกรอบของมัน ไม่ดันทั้งหน้า */
  .offi-doc,#report-doc{padding:14px;overflow-x:auto}
  .offi{font-size:12.5px}.offi th,.offi td{padding:4px 6px}
  .offi-title{font-size:16px}
  .offi-sign{flex-direction:column;gap:22px}
  /* ฉลากตัวอย่าง */
  .hzd-title{font-size:17px}.hzd-enname{font-size:17px}.hzd-drugs-label{font-size:20px}
  .hzd-icon-col img{width:62px;height:62px}
  .hzd-detail-text{padding-right:54px}
  /* หน้าต่างป๊อปอัป -> แผ่นเลื่อนขึ้นจากล่าง */
  #modal{align-items:flex-end;padding:0}
  .modal-box{max-width:100%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal-b{max-height:72vh}
  #toast{bottom:calc(86px + env(safe-area-inset-bottom));width:calc(100vw - 32px);font-size:13.5px;padding:11px 16px}
  .scan-box{min-height:220px}
  .pie-wrap{justify-content:center}
  .svgpie{width:180px;height:180px}
}

/* โทรศัพท์จอแคบมาก (<=380px) */
@media(max-width:380px){
  .stat-val{font-size:22px}
  .row,.reg .row{grid-template-columns:1fr}
  #nav button{width:70px}
}

/* โทรศัพท์แนวนอน (เตี้ย) — ลดขนาดแถบเมนูล่างเพื่อเหลือพื้นที่เนื้อหา */
@media(max-width:940px) and (max-height:480px) and (orientation:landscape){
  .rail{position:static}
  #nav button{flex-direction:row;width:auto;min-height:0;padding:7px 12px;font-size:12px;gap:6px;white-space:nowrap}
  main{padding-bottom:70px}
}

/* อุปกรณ์สัมผัส: ปุ่มเล็กให้แตะง่ายขึ้น */
@media(hover:none) and (pointer:coarse){
  .mini{min-height:34px}
  .ins-item{padding:12px}
}
/* ===== printing ===== */
#print-area{display:none}
@media screen{ body.printing .app{filter:blur(0)} }
@media print{
  @page{ size:A4; margin:10mm; }
  html,body,#print-area,#print-area *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; color-adjust:exact!important; }
  body.printing .app{ display:none !important; }
  body.printing #toast, body.printing #modal{ display:none !important; }
  #print-area{ display:block; }
  .print-sheet{ width:100%; }
  /* label: two per sheet like original (ส่วนที่ 1 + สำเนา) */
  #print-area.mode-label .hzlabel{ width:180mm; margin:0 auto 8mm; page-break-inside:avoid; }
  #print-area.mode-report .offi-doc{ border:0; padding:0; }
  .no-print{ display:none !important; }
}
</style>

const catOf = c => CAT.find(x=>x.c===c);
const CAT_DEFAULTS = CAT.map(c=>({ c:c.c, name:c.name, def:c.def, ex:c.ex, store:c.store, treat:c.treat }));
/* ---------- editable category text (name/def/ex/store/treat) ---------- */
const CAT_EDITABLE_FIELDS = ['name','def','ex','store','treat'];
function getCatOverrides(){ return LS.get(KEY_CAT_OV, {}); }
function applyCatOverrides(){
  const ov=getCatOverrides();
  CAT.forEach(c=>{ if(ov[c.c]) Object.assign(c, ov[c.c]); });
}
function saveCatOverride(code, fields){
  const ov=getCatOverrides();
  ov[code]={...(ov[code]||{}), ...fields};
  LS.set(KEY_CAT_OV, ov);
  const c=catOf(code); if(c) Object.assign(c, fields);
}
function resetCatOverride(code){
  const ov=getCatOverrides();
  delete ov[code];
  LS.set(KEY_CAT_OV, ov);
  const def=CAT_DEFAULTS.find(d=>d.c===code);
  const c=catOf(code);
  if(def && c) Object.assign(c, def);
}

function yearBE(dateStr){ const d=dateStr?new Date(dateStr+'T00:00:00'):new Date(); return d.getFullYear()+543; }
function nextCode(typeCode, dateStr){
  const lab=labCodeOf(), yb=yearBE(dateStr);
  const prefix=`${lab}-${typeCode}-${yb}-`;
  const cs = LS.get(KEY_C,[]).filter(x=>String(x.code||'').startsWith(prefix));
  let mx=0; cs.forEach(x=>{ const parts=String(x.code).split('-'); const n=parseInt(parts[parts.length-1]||'0',10); if(n>mx)mx=n; });
  return `${prefix}${String(mx+1).padStart(4,'0')}`;
}

function stageOptionsHTML(x){

  const grp=(arr,label)=>`<optgroup label="${label}">`+arr.map(s=>`<option value="${s}" ${s===cur?'selected':''}>${STAGE_LABEL[s]}</option>`).join('')+`</optgroup>`;
  return grp(STAGE_LAB,'ห้องปฏิบัติการ')+grp(STAGE_CENTRAL,'คลังของเสียกลาง');

function setStage(id, stage){
  const cs=LS.get(KEY_C,[]), x=cs.find(c=>c.id===id); if(!x) return;
  if(x.stage===stage) return;
  x.stage=stage; x.stageHistory=x.stageHistory||[]; x.stageHistory.push({stage, date:todayISO(), by:(LS.get(KEY_S,{}).gen||'')});
  x.updatedAt=nowISO(); LS.set(KEY_C,cs);
  toast('อัปเดตสถานะ: '+STAGE_LABEL[stage]);
  autoSyncMaybe(); render();
}
function qrSVG(text, cell){
  const qr = qrcode(0,'M'); qr.addData(text); qr.make();
  return qr.createSvgTag({cellSize:cell||3, margin:0, scalable:true});
}
function statusOf(x){
  if(x.disposed) return {k:'disposed', t:'ส่งกำจัดแล้ว', cls:'st-disposed'};
  const pct = x.capacity? x.current/x.capacity*100 : 0;
  if(x.awaiting || pct>=80) return {k:'awaiting', t: pct>=80?'เต็ม/รอกำจัด':'รอกำจัด', cls:'st-awaiting'};
  return {k:'filling', t:'กำลังบรรจุ', cls:'st-filling'};
}
function storageLimit(x){ // returns {limit, used, over, near}
  const pct = x.capacity? x.current/x.capacity*100:0;
  const ref = (pct>=80 && x.fullDate)? x.fullDate : x.startDate;
  const used = daysSince(ref);
  const limit = pct>=80?90:365;
  if(used==null) return {used:null,limit,over:false,near:false};
  return {used,limit,over:used>limit,near:used>limit-15 && used<=limit};
}

function mobilizeTables(root){
  // ใส่ data-label ให้ทุกเซลล์ เพื่อให้ตารางกลายเป็นการ์ดบนมือถือได้ (CSS ใช้ attr(data-label))
  (root||document).querySelectorAll('table.tbl:not(.offi)').forEach(t=>{
    const hs=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{ if(hs[i] && !td.hasAttribute('colspan')) td.setAttribute('data-label',hs[i]); });
    });
  });
}
function centerActiveNav(){
  const nav=document.getElementById('nav'); if(!nav) return;
  const b=nav.querySelector('button.active'); if(!b) return;
  if(nav.scrollWidth>nav.clientWidth) nav.scrollLeft=b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2;
}
window.addEventListener('resize',()=>{ centerActiveNav(); });

function render(){
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.v===view));
  const el=$('#main');
  if(view==='dash') el.innerHTML=viewDash();
  else if(view==='reg') el.innerHTML=viewReg();
  else if(view==='list') el.innerHTML=viewList();
  else if(view==='central') el.innerHTML=viewCentral();
  else if(view==='report') el.innerHTML=viewReport();
  else if(view==='criteria') el.innerHTML=viewCriteria();
  else if(view==='scan') el.innerHTML=viewScan();
  else if(view==='settings') el.innerHTML=viewSettings();
  el.scrollTop=0; window.scrollTo(0,0);
  mobilizeTables(el); centerActiveNav();
  if(view==='dash') drawCharts();
  if(view==='reg') updateLabelPreview();
  if(view==='scan') initScan();
}

let dashMonth=todayISO().slice(0,7);
function viewDash(){
  const cs=activeC(), inc=LS.get(KEY_I,[]);
  const yr=new Date().getFullYear();
  const live=cs.filter(x=>!x.disposed);
  const invL=live.filter(x=>catOf(x.typeCode).g!=='solid').reduce((s,x)=>s+(+x.current||0),0);
  const invK=live.filter(x=>catOf(x.typeCode).g==='solid').reduce((s,x)=>s+(+x.current||0),0);
  const disposedThisYr=cs.filter(x=>x.disposed && (x.disposedDate||'').slice(0,4)==String(yr));
  const dispL=disposedThisYr.reduce((s,x)=>s+(+x.current||0),0);
  const flam=live.filter(x=>catOf(x.typeCode).flam).reduce((s,x)=>s+(+x.current||0),0);
  // ของเสียที่เกิดขึ้นในเดือนที่เลือก (จาก fills)
  let genMonth=0; cs.forEach(x=>(x.fills||[]).forEach(f=>{ if((f.date||'').slice(0,7)===dashMonth) genMonth+=(+f.amount||0); }));
  const overdue=live.filter(x=>storageLimit(x).over);
  const near=live.filter(x=>storageLimit(x).near);
  const alerts=[];
  if(flam>38) alerts.push(`🔥 ของเสียไวไฟในห้องปฏิบัติการรวม ${flam.toFixed(1)} ลิตร เกิน 38 ลิตร (10 แกลลอน) — ต้องจัดเก็บในตู้เก็บสารไวไฟโดยเฉพาะ`);
  if(invL>200) alerts.push(`🧪 ของเสียเหลวคงคลังรวม ${invL.toFixed(1)} ลิตร เกิน 200 ลิตร (≈55 แกลลอน) — ต้องส่งกำจัดภายใน 3 วัน`);
  if(invK>200) alerts.push(`⚖️ ของเสียของแข็งคงคลังรวม ${invK.toFixed(1)} กก. เกินเกณฑ์ 200 กิโลกรัม`);
  overdue.forEach(x=>alerts.push(`⏰ ภาชนะ ${x.code} จัดเก็บนาน ${storageLimit(x).used} วัน เกินกำหนด ${storageLimit(x).limit} วัน — ต้องส่งกำจัด`));
  near.forEach(x=>alerts.push(`🗓️ ภาชนะ ${x.code} ใกล้ครบกำหนดจัดเก็บ (${storageLimit(x).used}/${storageLimit(x).limit} วัน)`));

  const accL=invL+dispL;
  const card=(cls,icon,label,val,unit,sub)=>`<div class="card stat s-${cls}"><div class="stat-top"><span class="stat-ic">${icon}</span><span class="stat-label">${label}</span></div><div class="stat-val">${val}<span class="stat-unit">${unit||''}</span></div><div class="stat-sub">${sub||''}</div></div>`;
  return `
  <div class="page-head"><div><h1>📊 แดชบอร์ด</h1><p class="muted">ภาพรวมการจัดการของเสียอันตราย ปี ${yr+543}</p></div>
    <div class="head-actions"><label class="inl">🗓️ เดือน <input type="month" id="dash-month" value="${dashMonth}"></label>
      <button class="btn ghost" data-act="add-incident">＋ บันทึกอุบัติการณ์</button></div></div>
  <div class="stat-grid">
    ${card('blue','🧪','ของเสียสะสมปีนี้', accL.toFixed(1),' ล.','คงคลัง+ส่งกำจัด • เดือนนี้ '+genMonth.toFixed(1))}
    ${card('green','♻️','ส่งกำจัดแล้วปีนี้', dispL.toFixed(1),' ล.', disposedThisYr.length+' ภาชนะ')}
    ${card('orange','📦','คงคลังปัจจุบัน', invL.toFixed(1),' ล.', invK.toFixed(1)+' กก. • '+live.length+' ภาชนะ')}
    ${card('red','🚨','อุบัติการณ์', inc.length,' ครั้ง', inc.length?('ล่าสุด '+fmtDate(inc[inc.length-1].date)):'ไม่มีรายงาน')}
  </div>
  <div class="alerts">
    <div class="alerts-head">⚠️ การแจ้งเตือนความปลอดภัย <span class="pill">${alerts.length}</span></div>
    ${alerts.length? alerts.map(a=>`<div class="alert-row">${esc(a)}</div>`).join('') : '<div class="alert-row ok">✅ ไม่มีการแจ้งเตือน ทุกอย่างอยู่ในเกณฑ์ปลอดภัย</div>'}
  </div>
  <div class="grid2">
    <div class="card"><div class="card-title">📈 ปริมาณของเสียที่เกิดขึ้นรายเดือน</div><div id="barc" class="chart"></div></div>
    <div class="card"><div class="card-title">🍩 สัดส่วนของเสียตามประเภท (คงคลัง)</div><div id="piec" class="chart"></div></div>
  </div>
  <details class="rulebox"><summary>📖 เกณฑ์การจัดเก็บของเสียในห้องปฏิบัติการ</summary>
    <ul>
      <li>ของเสียประเภท<b>ไวไฟ</b>ในห้องปฏิบัติการเก็บได้ไม่เกิน <b>10 แกลลอน (38 ลิตร)</b> หากเกินต้องเก็บใน<b>ตู้สำหรับเก็บสารไวไฟโดยเฉพาะ</b></li>

      <li>บรรจุของเสียได้ <b>ไม่เกิน 80%</b> ของความจุภาชนะเสมอ</li>
    </ul>
  </details>`;

/* ---------- Registry list ---------- */
function viewList(){
  const cs=activeC();
  if(!cs.length) return `<div class="page-head"><h1>📋 ทะเบียนของเสีย</h1></div><div class="empty">ยังไม่มีรายการ — ไปที่ “ลงทะเบียน & ฉลาก” เพื่อเพิ่มภาชนะแรก</div>`;
  const labName=(LS.get(KEY_S,{}).labFull)||'';
  const rows=cs.slice().reverse().map(x=>{
    const c=catOf(x.typeCode), st=statusOf(x), sl=storageLimit(x), unit=unitOf(c.g);
    const pct=x.capacity?Math.round(x.current/x.capacity*100):0;
    const insp=x.inspection; const ipass=insp?insp.items.filter(Boolean).length:0;
    const ibadge = insp? (ipass===6?`<span class="ins ok" title="ตรวจครบ 6 ข้อ">✔ ${ipass}/6</span>`:`<span class="ins warn" title="ผ่าน ${ipass}/6">⚠ ${ipass}/6</span>`) : `<span class="ins none">ยังไม่ตรวจ</span>`;
    return `<tr>
      <td class="mono">${esc(x.code)}</td>
      <td><span class="tag" style="--tc:${c.color}">${x.typeCode}</span> ${esc(c.name)}</td>
      <td>📍 ${esc(x.storageZone||'—')}${x.storageMap?`<div class="sub">🗺️ ${esc(x.storageMap)}</div>`:''}</td>
      <td class="ctr">📥 ${fmtDate(x.receivedDate)}</td>
      <td class="ctr">${(+x.current||0)}/${(+x.capacity||0)} ${unit}<div class="bar"><i style="width:${Math.min(pct,100)}%;background:${pct>=80?'#dc2626':'#0ea5a4'}"></i></div><div class="pctlbl ${pct>80?'red':''}">${pct}%${pct>80?' ⚠เกิน80%':''}</div></td>
      <td class="ctr"><span class="st ${st.cls}">${st.t}</span></td>
      <td class="ctr"><select class="mini-sel" data-act="change-stage" data-id="${x.id}" ${x.disposed?'disabled':''}>${stageOptionsHTML(x)}</select></td>
      <td class="ctr ${sl.over?'red':sl.near?'amber':''}">${sl.used==null?'—':sl.used+' ว.'}${sl.over?' ⚠':''}</td>
      <td class="ctr">${ibadge}</td>
      <td class="act">
        <button class="mini" data-act="edit" data-id="${x.id}">✏️ แก้ไข</button>
        <button class="mini" data-act="fill" data-id="${x.id}">➕ เติม</button>
        <button class="mini" data-act="inspect" data-id="${x.id}">🔍 ตรวจฉลาก</button>
        <button class="mini" data-act="print" data-id="${x.id}">🏷️ ฉลาก</button>
        <button class="mini" data-act="history" data-id="${x.id}">🕘 ประวัติ</button>
        ${(!x.disposed && stageOf(x)==='CAA')?`<button class="mini" data-act="send-central" data-id="${x.id}">🚚 ส่งเข้าคลังกลาง</button>`:''}
        <button class="mini danger" data-act="del" data-id="${x.id}">🗑️</button>
      </td></tr>`;
  }).join('');
  const totL=cs.filter(x=>!x.disposed&&catOf(x.typeCode).g!=='solid').reduce((s,x)=>s+(+x.current||0),0);
  const totK=cs.filter(x=>!x.disposed&&catOf(x.typeCode).g==='solid').reduce((s,x)=>s+(+x.current||0),0);
  return `
  <div class="page-head"><div><h1>📋 ทะเบียนของเสีย</h1><p class="muted">${labName?('🏫 '+esc(labName)+' • '):''}${cs.length} ภาชนะ • ปริมาณรวมคงคลัง ${totL.toFixed(1)} ล. / ${totK.toFixed(1)} กก.</p></div>
    <div class="head-actions"><button class="btn ghost" data-act="export">💾 สำรอง</button><button class="btn ghost" data-act="import">📥 นำเข้า</button></div></div>
  <div class="card nopad"><div class="tbl-scroll"><table class="tbl"><thead><tr><th>รหัส</th><th>ประเภท</th><th>ตำแหน่งจัดเก็บ</th><th>รับเข้า</th><th>ปริมาณ (%)</th><th>สถานะภาชนะ</th><th>สถานะจัดเก็บ</th><th>จัดเก็บ</th><th>ตรวจฉลาก</th><th>จัดการ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function showInspect(id){
  const x=LS.get(KEY_C,[]).find(c=>c.id===id); if(!x)return;
  const cur=(x.inspection&&x.inspection.items)||[false,false,false,false,false,false];
  const items=INSPECT.map((t,i)=>`<label class="ins-item"><input type="checkbox" class="insp-chk" data-i="${i}" ${cur[i]?'checked':''}> <span>${i+1}. ${esc(t)}</span></label>`).join('');
  modal(`🔍 ตรวจเช็คฉลาก/ภาชนะ — ${x.code}`,
    `<div class="ins-list">${items}</div>
     ${x.inspection?`<div class="muted" style="margin-top:8px">ตรวจล่าสุด: ${fmtDate(x.inspection.date)} โดย ${esc(x.inspection.by||'—')}</div>`:''}
     <button class="btn primary block" data-act="save-inspect" data-id="${x.id}" style="margin-top:12px">บันทึกผลการตรวจ</button>`);
}
function saveInspect(id){
  const cs=LS.get(KEY_C,[]), x=cs.find(c=>c.id===id); if(!x)return;
  const items=[...document.querySelectorAll('.insp-chk')].sort((a,b)=>a.dataset.i-b.dataset.i).map(c=>c.checked);
  x.inspection={items, date:todayISO(), by:(LS.get(KEY_S,{}).gen||'')}; x.updatedAt=nowISO();
  LS.set(KEY_C,cs); closeModal();
  const pass=items.filter(Boolean).length;
  toast(pass===6?'ตรวจผ่านครบ 6 ข้อ ✔':`บันทึกผลตรวจแล้ว (${pass}/6)`);
  autoSyncMaybe(); render();
}

/* ---------- คลังของเสียกลาง (Central Waste Warehouse) ---------- */
function viewCentral(){
  const cs=activeC().filter(x=>!x.disposed && isCentralStage(stageOf(x)));
  const near90=cs.filter(x=>storageLimit(x).near || storageLimit(x).over);
  const summary=STAGE_CENTRAL.map(s=>{
    const items=cs.filter(x=>stageOf(x)===s);
    const amt=items.reduce((a,x)=>a+(+x.current||0),0);
    return `<div class="card stat s-blue"><div class="stat-top"><span class="stat-label">${STAGE_LABEL[s]}</span></div><div class="stat-val">${items.length}<span class="stat-unit"> ภาชนะ</span></div><div class="stat-sub">รวม ${amt.toFixed(1)} หน่วย</div></div>`;
  }).join('');
  const rows=cs.slice().reverse().map(x=>{

    const pct=x.capacity?Math.round(x.current/x.capacity*100):0;
    const nextStage = st==='central_CAA'?'awaiting_disposal':(st==='awaiting_disposal'?'delivered':null);
    return `<tr>
      <td class="mono">${esc(x.code)}</td>
      <td><span class="tag" style="--tc:${c.color}">${x.typeCode}</span> ${esc(c.name)}</td>
      <td>🏫 ${esc(x.lab||'—')}</td>

      <td class="ctr"><span class="st st-awaiting">${STAGE_LABEL[st]}</span></td>
      <td class="ctr ${sl.over?'red':sl.near?'amber':''}">${sl.used==null?'—':sl.used+' ว.'}${sl.over?' ⚠':(sl.near?' 🗓️':'')}</td>
      <td class="act">
        <button class="mini" data-act="history" data-id="${x.id}">🕘 ประวัติ</button>

        ${st==='delivered'?`<button class="mini" data-act="dispose-central" data-id="${x.id}">♻️ บันทึกส่งกำจัด</button>`:''}
      </td></tr>`;
  }).join('');
  const disposedAll=activeC().filter(x=>x.disposed).sort((a,b)=>String(b.deliveredDate||b.disposedDate||'').localeCompare(String(a.deliveredDate||a.disposedDate||'')));
  const dRows=disposedAll.map(x=>{
    const c=catOf(x.typeCode);
    return `<tr>
      <td class="mono">${esc(x.code)}</td>
      <td><span class="tag" style="--tc:${c.color}">${x.typeCode}</span> ${esc(c.name)}</td>
      <td>${esc(x.disposalVendor||'—')}</td>
      <td class="ctr">${x.deliveredDate?fmtDate(x.deliveredDate):(x.disposedDate?fmtDate(x.disposedDate):'—')}</td>
      <td class="mono ctr">${esc(x.manifestNo||'—')}</td>
      <td class="ctr">${x.certDate?fmtDate(x.certDate):'<span class="amber">ยังไม่ได้รับ</span>'}</td>
      <td class="act"><button class="mini" data-act="edit-dispose" data-id="${x.id}">✏️ แก้ไขข้อมูล</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="page-head"><div><h1>🏭 คลังของเสียกลาง</h1><p class="muted">สำหรับผู้ดูแลคลังของเสียกลาง: รับของเสียจากห้องปฏิบัติการ คัดแยก จัดเก็บใน CAA รอส่งกำจัด และบันทึกการส่งมอบ/กำจัด</p></div></div>
  <div class="stat-grid">${summary}</div>

let reportMode='05', fiscalRound='1';
function amountsForMonth(cs, ym){ // sum fills within month by typeCode + collect codes
  const out={}; cs.forEach(x=>{ (x.fills||[]).forEach(f=>{ if((f.date||'').slice(0,7)===ym){ const o=out[x.typeCode]=out[x.typeCode]||{amt:0,codes:new Set()}; o.amt+=(+f.amount||0); o.codes.add(x.code);} }); });
  return out;
}
function amountsForDisposal(cs){ // current amount of containers awaiting/ready, by typeCode
  const out={}; cs.filter(x=>!x.disposed && statusOf(x).k==='awaiting').forEach(x=>{ const o=out[x.typeCode]=out[x.typeCode]||{amt:0,codes:new Set()}; o.amt+=(+x.current||0); o.codes.add(x.code); }); return out;
}
function officialTable(data, isDisposal){
  const cell=(code,name,unit)=>{ const d=data[code]; const amt=d?d.amt:0; const codes=d?[...d.codes].join(', '):'';
    return `<tr><td class="mono ctr">${code.length<=3?code:''}</td><td>${esc(name)}</td><td class="ctr">${amt>0?amt.toFixed(amt%1?1:0):''}</td><td class="ctr">${unit}</td>${isDisposal?'':`<td>${esc(codes)}</td>`}</tr>`; };
  const lRows=OFFICIAL_L.map(([c,n])=>cell(c,n,'ลิตร')).join('');
  const sRows=OFFICIAL_S.map(([c,n,u])=>cell(c,n,u)).join('');
  const sumL=OFFICIAL_L.reduce((s,[c])=>s+((data[c]&&data[c].amt)||0),0);
  const sumS=OFFICIAL_S.reduce((s,[c])=>s+((data[c]&&data[c].amt)||0),0);
  const cols=isDisposal?4:5;
  return `<table class="tbl offi"><thead><tr><th>รหัสของเสีย</th><th>ประเภทของเสีย</th><th>ปริมาณ</th><th>หน่วย</th>${isDisposal?'':'<th>หมายเหตุ</th>'}</tr></thead>
    <tbody><tr class="sec"><td colspan="${cols}">ของเสียที่เป็นของเหลว (Liquid)</td></tr>${lRows}
    <tr class="sum"><td colspan="2">รวมของเหลว</td><td class="ctr">${sumL?sumL.toFixed(sumL%1?1:0):''}</td><td class="ctr">ลิตร</td>${isDisposal?'':'<td></td>'}</tr>
    <tr class="sec"><td colspan="${cols}">ของเสียที่เป็นของแข็ง (Solid)</td></tr>${sRows}
    <tr class="sum"><td colspan="2">รวมของแข็ง</td><td class="ctr">${sumS?sumS.toFixed(sumS%1?1:0):''}</td><td class="ctr">กก./ขวด</td>${isDisposal?'':'<td></td>'}</tr>
    </tbody></table>`;
}

/* ---------- QR camera scan ---------- */
let _scanner=null;
function viewScan(){
  return `
  <div class="page-head"><div><h1>📷 สแกน QR Code</h1><p class="muted">สแกนรหัสบนฉลากภาชนะเพื่อเปิดข้อมูล เติมของเสีย หรือพิมพ์ฉลากซ้ำ</p></div></div>
  <div class="grid2">
    <div class="card">
      <div id="scan-box" class="scan-box"><div class="scan-hint">กำลังเตรียมกล้อง…</div></div>
      <div id="scan-status" class="scan-status"></div>
      <div class="scan-manual">
        <label class="fld"><span>หรือกรอกรหัสภาชนะเอง</span>
          <div class="inl-row"><input id="scan-code" type="text" placeholder="เช่น L01-002"><button class="btn primary" data-act="scan-lookup">ค้นหา</button></div></label>
      </div>
    </div>
    <div class="card"><div class="card-title">ผลการสแกน</div><div id="scan-result"><div class="empty sm">ยังไม่มีการสแกน — เล็งกล้องไปที่ QR บนฉลาก</div></div></div>
  </div>`;
}
function initScan(){
  const box=$('#scan-box'); if(!box) return;
  if(typeof Html5Qrcode==='undefined'){ box.innerHTML='<div class="scan-hint">ไม่สามารถโหลดตัวอ่าน QR ได้ (ต้องต่ออินเทอร์เน็ตครั้งแรก)<br>ใช้ช่องกรอกรหัสด้านล่างแทนได้</div>'; return; }
  box.innerHTML='';
  try{
    _scanner=new Html5Qrcode('scan-box');
    _scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:220,height:220}},
      txt=>{ handleScan(txt); },
      ()=>{}).catch(err=>{ $('#scan-status').innerHTML='<span class="red">เปิดกล้องไม่สำเร็จ: '+esc(err)+' — ใช้ช่องกรอกรหัสด้านล่างได้</span>'; });
  }catch(e){ $('#scan-status').innerHTML='<span class="red">เปิดกล้องไม่ได้ — ใช้ช่องกรอกรหัส</span>'; }
}
function stopScan(){ if(_scanner){ try{ _scanner.stop().then(()=>{_scanner.clear();_scanner=null;}).catch(()=>{_scanner=null;}); }catch(e){_scanner=null;} } }
function handleScan(txt){
  const code=(String(txt).split('|')[1]||String(txt)).trim();
  const beep=$('#scan-status'); if(beep) beep.innerHTML='<span class="ok-t">สแกนสำเร็จ: '+esc(code)+'</span>';
  lookupContainer(code);
}
function lookupContainer(code){
  const x=activeC().find(c=>c.code.toLowerCase()===String(code).toLowerCase());
  const box=$('#scan-result'); if(!box) return;
  if(!x){ box.innerHTML=`<div class="alert-row">ไม่พบภาชนะรหัส <b>${esc(code)}</b> ในทะเบียน<br><button class="btn ghost sm" data-act="goto-reg" style="margin-top:8px">ไปลงทะเบียนใหม่</button></div>`; return; }
  const c=catOf(x.typeCode), st=statusOf(x), u=unitOf(c.g), pct=x.capacity?Math.round(x.current/x.capacity*100):0;
  box.innerHTML=`<div class="scan-card">
    <div class="sc-h" style="background:${c.color}">${esc(x.code)} · ${esc(c.name)}</div>
    <div class="sc-b">
      <div><b>องค์ประกอบ:</b> ${esc(x.composition||'—')}</div>
      <div><b>ปริมาณ:</b> ${x.current}/${x.capacity} ${u} (${pct}%)</div>
      <div><b>สถานะภาชนะ:</b> <span class="st ${st.cls}">${st.t}</span></div>
      <div><b>สถานะจัดเก็บ:</b> ${esc(STAGE_LABEL[stageOf(x)]||'—')}</div>
      <div><b>ห้องปฏิบัติการ:</b> ${esc(x.lab||'—')}</div>
      <div><b>ประวัติสถานะจัดเก็บ:</b> ${(x.stageHistory&&x.stageHistory.length)?('<ul class="sc-stghist">'+x.stageHistory.map(h=>`<li>${fmtDate(h.date)} — ${esc(STAGE_LABEL[h.stage]||h.stage)}${h.by?(' โดย '+esc(h.by)):''}</li>`).join('')+'</ul>'):'—'}</div>
      <div class="sc-act">
        <button class="btn primary sm" data-act="fill" data-id="${x.id}">เติมของเสีย</button>
        <button class="btn ghost sm" data-act="print" data-id="${x.id}">พิมพ์ฉลาก</button>
        <button class="btn ghost sm" data-act="history" data-id="${x.id}">ประวัติการเติม</button>
        ${(!x.disposed && stageOf(x)==='CAA')?`<button class="btn ghost sm" data-act="send-central" data-id="${x.id}">ส่งเข้าคลังของเสียกลาง</button>`:''}
        ${x.disposed?'':`<button class="btn ghost sm" data-act="dispose" data-id="${x.id}">ส่งกำจัด</button>`}
      </div></div></div>`;
}

async function cloudPush(silent){
  const url=cloudUrl(); if(!url){ if(!silent)toast('ยังไม่ได้ตั้งค่า Web App URL'); return; }
  setSync('กำลังอัปโหลด…');
  try{
    const body=JSON.stringify({action:'save', containers:LS.get(KEY_C,[]), incidents:LS.get(KEY_I,[])});
    const r=await fetch(url,{method:'POST', body, headers:{'Content-Type':'text/plain;charset=utf-8'}});
    const text=await r.text();
    let j=null; try{ j=JSON.parse(text); }catch(e){ /* ไม่ใช่ JSON = ไม่สำเร็จ (มักเป็นหน้า login/ข้อผิดพลาดของ Apps Script) */ }
    if(!r.ok || !j || j.ok!==true){
      const detail = (j&&j.error) ? j.error : ('HTTP '+r.status+(text?(' — '+text.slice(0,150)):''));
      setSync('อัปโหลดไม่สำเร็จ: '+detail);
      if(!silent) toast('อัปโหลดไม่สำเร็จ — ดูรายละเอียดที่สถานะซิงก์ด้านล่าง');
      return;
    }
    const s=LS.get(KEY_S,{}); s.lastSync=new Date().toLocaleString('th-TH'); LS.set(KEY_S,s);
    setSync('อัปโหลดสำเร็จ • '+s.lastSync); if(!silent)toast('อัปโหลดขึ้นคลาวด์แล้ว');
  }catch(e){ setSync('เชื่อมต่อไม่สำเร็จ: '+e.message); if(!silent)toast('เชื่อมต่อคลาวด์ไม่สำเร็จ'); }
}
/* client-side merge (mirror ของ Code.gs): id ใหม่=เพิ่ม, id เดิม=updatedAt ใหม่กว่าชนะ */
function mergeById(base, incoming){
  const map={}; (base||[]).forEach(x=>{ if(x&&x.id) map[x.id]=x; });
  (incoming||[]).forEach(x=>{ if(!x||!x.id) return; const cur=map[x.id];
    if(!cur){ map[x.id]=x; return; }
    const a=Date.parse(x.updatedAt||'')||0, b=Date.parse(cur.updatedAt||'')||0;
    if((a===0&&b===0)||a>=b) map[x.id]=x; });
  return Object.keys(map).map(k=>map[k]);
}
function mergeIncidents(base, incoming){
  const key=x=>x.id||((x.date||'')+'|'+(x.desc||'')); const map={};
  (base||[]).forEach(x=>{if(x)map[key(x)]=x;}); (incoming||[]).forEach(x=>{if(x&&!(key(x) in map))map[key(x)]=x;});
  return Object.keys(map).map(k=>map[k]);
}
async function cloudPull(){
  const url=cloudUrl(); if(!url){ toast('ยังไม่ได้ตั้งค่า Web App URL'); return; }
  if(!confirm('ดึงข้อมูลจากคลาวด์และรวมเข้ากับข้อมูลในเครื่องนี้ (ตัวที่แก้ล่าสุดจะชนะ) ดำเนินการต่อ?')) return;
  setSync('กำลังดึงข้อมูล…');
  try{
    const r=await fetch(url,{method:'GET'}); const j=await r.json();
    if(j.containers) LS.set(KEY_C, mergeById(LS.get(KEY_C,[]), j.containers));
    if(j.incidents) LS.set(KEY_I, mergeIncidents(LS.get(KEY_I,[]), j.incidents));
    const s=LS.get(KEY_S,{}); s.lastSync=new Date().toLocaleString('th-TH'); LS.set(KEY_S,s);
    toast('รวมข้อมูลจากคลาวด์แล้ว ('+activeC().length+' ภาชนะ)'); render();
  }catch(e){ setSync('ดึงข้อมูลไม่สำเร็จ: '+e.message); toast('ดึงข้อมูลไม่สำเร็จ'); }
}

const PIE_PALETTE=['#0ea5a4','#f97316','#6366f1','#ec4899','#22c55e','#eab308','#06b6d4','#ef4444','#8b5cf6','#14b8a6','#f59e0b','#3b82f6','#d946ef','#84cc16'];
function drawCharts(){
  const cs=activeC();
  const now=new Date(), months=[], vals=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d); vals.push(0); }
  const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const idx={}; months.forEach((d,i)=>idx[key(d)]=i);
  cs.forEach(x=>(x.fills||[]).forEach(f=>{ const k=(f.date||'').slice(0,7); if(k in idx) vals[idx[k]]+=(+f.amount||0); }));
  const hi=months.findIndex(d=>key(d)===dashMonth);
  const bc=$('#barc'); if(bc) bc.innerHTML=barChart(months.map(d=>d.toLocaleDateString('th-TH',{month:'short'})), vals, hi);
  // donut by type NAME
  const grp={}; cs.filter(x=>!x.disposed).forEach(x=>{const c=catOf(x.typeCode); grp[c.c]=(grp[c.c]||0)+(+x.current||0);});
  const keys=Object.keys(grp).filter(k=>grp[k]>0).sort((a,b)=>grp[b]-grp[a]);
  const segs=keys.map((k,i)=>({label:catOf(k).name, code:k, value:grp[k], color:PIE_PALETTE[i%PIE_PALETTE.length]}));
  const pc=$('#piec'); if(pc) pc.innerHTML=segs.length?donutChart(segs):'<div class="empty sm">ยังไม่มีข้อมูล</div>';
}
function barChart(labels, vals, hi){
  const W=520,H=240,pad=34, max=Math.max(1,...vals), n=vals.length, bw=(W-pad*2)/n*0.62, gap=(W-pad*2)/n;
  let bars='', grid='';
  for(let i=0;i<=4;i++){ const y=H-pad-(H-pad*2)*i/4; grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#e6eaee"/><text x="${pad-6}" y="${y+3}" text-anchor="end" class="axl">${(max*i/4).toFixed(0)}</text>`; }
  vals.forEach((v,i)=>{ const h=(H-pad*2)*v/max, x=pad+gap*i+(gap-bw)/2, y=H-pad-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${i===hi?'#e8842b':'#4472c4'}"><title>${labels[i]}: ${v.toFixed(1)}</title></rect>`;
    if(v>0) bars+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" class="axl">${v.toFixed(0)}</text>`;
    bars+=`<text x="${x+bw/2}" y="${H-pad+14}" text-anchor="middle" class="axl">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="svgchart">${grid}${bars}</svg>`;
}
function donutChart(segs){
  const total=segs.reduce((s,x)=>s+x.value,0), cx=110,cy=110,r=92,ri=52; let a=-Math.PI/2, paths='';
  const ring=(col,lbl,val)=>`<g><circle cx="${cx}" cy="${cy}" r="${(r+ri)/2}" fill="none" stroke="${col}" stroke-width="${r-ri}"><title>${esc(lbl)}: ${val.toFixed(1)}</title></circle></g>`;
  if(segs.length===1){ paths=ring(segs[0].color, segs[0].label, segs[0].value); }
  else segs.forEach(s=>{ let ang=s.value/total*2*Math.PI; if(ang>6.2830)ang=6.2830; const a2=a+ang;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi1=cx+ri*Math.cos(a2),yi1=cy+ri*Math.sin(a2),xi2=cx+ri*Math.cos(a),yi2=cy+ri*Math.sin(a), big=ang>Math.PI?1:0;
    paths+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${xi1.toFixed(1)} ${yi1.toFixed(1)} A${ri} ${ri} 0 ${big} 0 ${xi2.toFixed(1)} ${yi2.toFixed(1)} Z" fill="${s.color}" stroke="#fff" stroke-width="2"><title>${esc(s.label)}: ${s.value.toFixed(1)}</title></path>`; a=a2; });
  const legend=segs.map(s=>`<div class="lg"><i style="background:${s.color}"></i><span class="lg-name">${esc(s.label)}</span><b>${(s.value/total*100).toFixed(0)}%</b></div>`).join('');
  return `<div class="pie-wrap"><svg viewBox="0 0 220 220" class="svgpie"><g>${paths}</g><text x="110" y="106" text-anchor="middle" class="donut-c">${total.toFixed(0)}</text><text x="110" y="124" text-anchor="middle" class="donut-u">รวม</text></svg><div class="legend">${legend}</div></div>`;
}

    view='list'; render();
    return;
  }

  const rec=Object.assign({id:'c'+Date.now(), awaiting:false, disposed:false, createdAt:todayISO(), updatedAt:nowISO(), inspection:null,
    stage:'sorting', stageHistory:[{stage:'sorting', date:todayISO(), by:d.generator}],

    + '#print-area.mode-report .offi-doc{border:0;padding:0}'

/* พิมพ์เนื้อหาแบบทนทาน: 1) iframe ซ่อน  2) หน้าต่างใหม่  3) พิมพ์ในหน้าเดิม */
function printContent(inner, mode){
  const src=buildPrintDoc(inner, mode);
  // 1) hidden iframe — ไม่ต้องใช้ popup, ใช้ได้แม้ฝังใน iframe ส่วนใหญ่
  try{
    const ifr=document.createElement('iframe');
    ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
    document.body.appendChild(ifr);
    const cleanup=()=>{ setTimeout(()=>{ try{ document.body.removeChild(ifr); }catch(_){} }, 3000); };
    const run=()=>{
      let ok=false;
      try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); ok=true; }catch(e){ ok=false; }
      cleanup();
      if(!ok) winPrint(inner, mode);
    };
    ifr.onload=()=>setTimeout(run,250);
    const d=ifr.contentWindow.document; d.open(); d.write(src); d.close();
    // เผื่อ onload ไม่ยิง (บาง browser เมื่อ document.write)
    setTimeout(()=>{ if(ifr.contentWindow && ifr.contentWindow.document.readyState==='complete' && !ifr.dataset.ran){ ifr.dataset.ran='1'; run(); } }, 600);
    return;
  }catch(e){ /* ไปวิธีถัดไป */ }
  winPrint(inner, mode);
}
function winPrint(inner, mode){
  let w=null;
  try{ w=window.open('','_blank'); }catch(e){ w=null; }
  if(w && w.document){
    const src=buildPrintDoc(inner, mode)
      .replace('</body></html>',
        '<scr'+'ipt>window.onload=function(){setTimeout(function(){try{window.focus();window.print();}catch(e){}},250);};'
        +'window.onafterprint=function(){setTimeout(function(){try{window.close();}catch(e){}},300);};<\/scr'+'ipt></body></html>');
    w.document.open(); w.document.write(src); w.document.close();
    return;
  }
  inPlacePrint(inner, mode);
}
function inPlacePrint(inner, mode){
  const area=$('#print-area'); if(!area){ toast('พิมพ์ไม่สำเร็จ'); return; }
  area.className=mode;
  area.innerHTML='<div class="print-sheet">'+inner+'</div>';
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing'); area.innerHTML=''; area.className=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ try{ if(window.print) window.print(); else toast('เบราว์เซอร์นี้พิมพ์ไม่ได้'); }catch(e){ toast('หน้านี้ถูกบล็อกการพิมพ์ กรุณาเปิดไฟล์ในเบราว์เซอร์โดยตรง'); } setTimeout(done,1500); }, 80);
}
function printLabel(x){
  if(!x){ toast('ไม่พบข้อมูลฉลาก'); return; }
  printContent(labelHTML(x,{part:1})+labelHTML(x,{part:2}), 'mode-label');
}
function printReport(){
  const doc=$('#report-doc'); if(!doc){ toast('ไม่พบรายงาน'); return; }
  printContent(doc.outerHTML, 'mode-report');
}
function exportData(){
  const data={containers:LS.get(KEY_C,[]),incidents:LS.get(KEY_I,[]),settings:LS.get(KEY_S,{})};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='hzw-backup-'+todayISO()+'.json'; a.click(); toast('ดาวน์โหลดไฟล์สำรองแล้ว');
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(d.containers)LS.set(KEY_C,d.containers); if(d.incidents)LS.set(KEY_I,d.incidents); if(d.settings)LS.set(KEY_S,d.settings);
      toast('นำเข้าข้อมูลสำเร็จ'); render(); }catch(err){ toast('ไฟล์ไม่ถูกต้อง'); } }; r.readAsText(f); };
  inp.click();
}

/* ---------- UI utils ---------- */
function toast(m){ let t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function modal(title,body){ $('#modal').innerHTML=`<div class="modal-box"><div class="modal-h">${esc(title)}<button class="modal-x" data-act="close-modal">✕</button></div><div class="modal-b">${body}</div></div>`; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); $('#modal').innerHTML=''; }

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const nav=e.target.closest('#nav button'); if(nav){ if(view==='scan')stopScan(); view=nav.dataset.v; render(); return; }
  const a=e.target.closest('[data-act]'); if(!a)return; const act=a.dataset.act, id=a.dataset.id;
  if(act==='save-container') saveContainer();
  else if(act==='print-preview') printLabel(draftFromForm());
  else if(act==='fill') fillContainer(id);
  else if(act==='print'){ const x=LS.get(KEY_C,[]).find(c=>c.id===id); if(x)previewLabel(x); }
  else if(act==='do-print-label'){ const x=LS.get(KEY_C,[]).find(c=>c.id===id); if(x)printLabel(x); }
  else if(act==='history') showHistory(id);
  else if(act==='dispose') disposeContainer(id);
  else if(act==='dispose-central' || act==='edit-dispose') showDisposeModal(id);
  else if(act==='save-dispose') saveDisposeDetails(id);
  else if(act==='del') delContainer(id);
  else if(act==='edit') editContainer(id);
  else if(act==='cancel-edit') cancelEdit();
  else if(act==='add-incident') addIncident();
  else if(act==='export') exportData();
  else if(act==='import') importData();
  else if(act==='print-report') printReport();
  else if(act==='close-modal') closeModal();
  else if(act==='use-type'){ formType=a.dataset.code; view='reg'; render(); }
  else if(act==='edit-cat') openEditCat(a.dataset.code);
  else if(act==='save-cat') saveEditCat(a.dataset.code);
  else if(act==='reset-cat') resetEditCat(a.dataset.code);
  else if(act==='rep-mode'){ reportMode=a.dataset.m; $('#main').innerHTML=viewReport(); }
  else if(act==='scan-lookup'){ const v=$('#scan-code').value.trim(); if(v)lookupContainer(v); }
  else if(act==='goto-reg'){ stopScan(); view='reg'; render(); }
  else if(act==='save-settings') saveSettings();
  else if(act==='cloud-push') cloudPush(false);
  else if(act==='cloud-pull') cloudPull();
  else if(act==='reset-all') resetAll();
  else if(act==='inspect') showInspect(id);
  else if(act==='save-inspect') saveInspect(id);
  else if(act==='send-central') setStage(id,'central_CAA');
  else if(act==='advance-stage') setStage(id, a.dataset.stage);
});
document.addEventListener('change', e=>{
  const sel=e.target.closest('select[data-act="change-stage"]'); if(sel){ setStage(sel.dataset.id, sel.value); }
});
document.addEventListener('input', e=>{
  if(['f-type','f-comp','f-cap','f-cur','f-gen','f-lab','f-phone','f-zone','f-map','f-received','f-start','f-full'].includes(e.target.id)){ if(e.target.id==='f-type')formType=e.target.value; updateLabelPreview(); }
  else if(e.target.id==='crit-q'){ criteriaQ=e.target.value; const el=$('#main'); el.innerHTML=viewCriteria(); $('#crit-q').focus(); $('#crit-q').setSelectionRange(criteriaQ.length,criteriaQ.length); }
  else if(e.target.id==='rep-month'){ reportMonth=e.target.value; $('#main').innerHTML=viewReport(); }
  else if(e.target.id==='rep-round'){ fiscalRound=e.target.value; }
  else if(e.target.id==='dash-month'){ dashMonth=e.target.value; $('#main').innerHTML=viewDash(); drawCharts(); }
});
applyCatOverrides();
render();
